name: Materialize pinned upstream baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - UPSTREAM.lock
      - FORK.md
      - .github/workflows/materialize-upstream.yml

permissions:
  contents: write

concurrency:
  group: materialize-upstream
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out fork metadata
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read and validate upstream lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail

          read_lock_value() {
            local key="$1"
            local count value
            count="$(awk -F= -v key="$key" '$1 == key { count += 1 } END { print count + 0 }' UPSTREAM.lock)"
            test "$count" -eq 1
            value="$(awk -F= -v key="$key" '$1 == key { sub(/^[^=]*=/, ""); print }' UPSTREAM.lock)"
            test -n "$value"
            printf '%s' "$value"
          }

          repository="$(read_lock_value repository)"
          sha="$(read_lock_value sha)"
          version="$(read_lock_value version)"
          branch="$(read_lock_value branch)"

          [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
          [[ "$branch" =~ ^codex/upstream-[0-9A-Za-z][0-9A-Za-z._/-]*$ ]]

          {
            echo "repository=$repository"
            echo "sha=$sha"
            echo "version=$version"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch exact upstream revision
        shell: bash
        env:
          UPSTREAM_REPOSITORY: ${{ steps.lock.outputs.repository }}
          UPSTREAM_SHA: ${{ steps.lock.outputs.sha }}
        run: |
          set -euo pipefail
          upstream_dir="$RUNNER_TEMP/upstream"
          git init "$upstream_dir"
          git -C "$upstream_dir" remote add origin "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git -C "$upstream_dir" fetch --depth=1 origin "$UPSTREAM_SHA"
          git -C "$upstream_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$upstream_dir" rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Materialize immutable review branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.lock.outputs.branch }}
          SOURCE_SHA: ${{ steps.lock.outputs.sha }}
          SOURCE_VERSION: ${{ steps.lock.outputs.version }}
        run: |
          set -euo pipefail
          metadata_dir="$RUNNER_TEMP/fork-metadata"
          mkdir -p "$metadata_dir/.github/workflows"
          cp FORK.md "$metadata_dir/FORK.md"
          cp UPSTREAM.lock "$metadata_dir/UPSTREAM.lock"
          cp .github/workflows/materialize-upstream.yml "$metadata_dir/.github/workflows/materialize-upstream.yml"

          git checkout -B "$TARGET_BRANCH"
          rsync -a --delete --exclude='.git/' "$RUNNER_TEMP/upstream/" "$GITHUB_WORKSPACE/"
          cp "$metadata_dir/FORK.md" FORK.md
          cp "$metadata_dir/UPSTREAM.lock" UPSTREAM.lock
          mkdir -p .github/workflows
          cp "$metadata_dir/.github/workflows/materialize-upstream.yml" .github/workflows/materialize-upstream.yml

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: materialize upstream ${SOURCE_VERSION} (${SOURCE_SHA})"

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install launcher dependencies
        working-directory: launcher
        run: bun install --frozen-lockfile

      - name: Run upstream authoritative verification
        run: bun run verify

      - name: Confirm verification left source clean
        shell: bash
        run: test -z "$(git status --porcelain)"

      - name: Publish verified baseline branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.lock.outputs.branch }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | awk '{ print $1 }')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${remote_sha}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          fi
