name: Apply enhanced hardening

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-enhanced-hardening.yml

permissions:
  contents: write

concurrency:
  group: enhanced-hardening
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/upstream-5.0.1
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Retarget transform to the pinned source and apply hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-enhanced-hardening.mjs")
          text = path.read_text()

          old_root = 'const repositoryRoot = resolve(fileURLToPath(new URL("..", import.meta.url)), "..");'
          new_root = 'const repositoryRoot = resolve(fileURLToPath(new URL(".", import.meta.url)), "..");'
          if old_root in text:
              text = text.replace(old_root, new_root, 1)
          elif new_root not in text:
              raise SystemExit("transform root declaration did not match the pinned source")

          stale_main_blocks = [
          '''replaceRegex(
            "launcher/electron/main.cjs",
            /const subagentProtocol = runtimeConfig\.subagentProtocol === "native"\s*\? "native"\s*: "compatibility-v1";/g,
            'const subagentProtocol = runtimeConfig.subagentProtocol === "compatibility-v1" ? "compatibility-v1" : "native";',
          );
          ''',
          '''replaceRegex(
            "launcher/electron/main.cjs",
            /("--subagent-protocol",\s*)"compatibility-v1",/g,
            "$1subagentProtocol,",
          );
          ''',
          ]
          for block in stale_main_blocks:
              if block not in text:
                  raise SystemExit("stale launcher protocol block did not match the pinned transform")
              text = text.replace(block, "", 1)

          stale_launcher_scan = '''let launcherFallbacks = 0;
          for (const absolute of walk(join(repositoryRoot, "launcher", "electron"))) {
            const path = relative(repositoryRoot, absolute);
            if (path.includes(`${join("launcher", "tests")}`)) continue;
            const text = readFileSync(absolute, "utf8");
            const before = 'options.subagentProtocol ?? "compatibility-v1"';
            const count = occurrenceCount(text, before);
            if (count === 0) continue;
            launcherFallbacks += count;
            writeFileSync(absolute, text.replaceAll(before, 'options.subagentProtocol ?? "native"'));
          }
          if (launcherFallbacks < 1) {
            throw new Error("No launcher subagent-protocol fallback was found");
          }

          '''
          if stale_launcher_scan not in text:
              raise SystemExit("stale launcher fallback scan did not match the pinned transform")
          text = text.replace(stale_launcher_scan, "", 1)

          setup_anchor = '''replaceLiteral(
            "src/codex-integration.ts",
            '  fallback: AppConfig["subagentProtocol"] = "compatibility-v1",',
            '  fallback: AppConfig["subagentProtocol"] = "native",',
          );
          '''
          setup_patch = setup_anchor + '''replaceLiteral(
            "src/setup.ts",
            '      ?? readCodexSubagentProtocol(existing?.subagentProtocol ?? "compatibility-v1"),',
            '      ?? readCodexSubagentProtocol(existing?.subagentProtocol ?? "native"),',
          );
          '''
          if setup_anchor not in text:
              raise SystemExit("Codex protocol fallback anchor did not match the pinned transform")
          text = text.replace(setup_anchor, setup_patch, 1)

          generated_marker = 'writeGenerated("src/native-model-default.ts", nativeDefaultModule);'
          marker_index = text.index(generated_marker)
          block_start = text.index('replaceLiteral(\n  "src/codex-integration.ts",', marker_index)
          block_end = text.index(');\n', block_start) + len(');\n')
          import_rule = text[block_start:block_end]
          if 'preserveNativeCodexModelDefault' not in import_rule:
              raise SystemExit("first post-generation integration rule was not the migration import")
          text = text[:block_start] + text[block_end:]

          path.write_text(text)
          PY

          bun scripts/apply-enhanced-hardening.mjs

          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, before: str, after: str) -> None:
              text = path.read_text()
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{path}: expected one contract block, found {count}")
              path.write_text(text.replace(before, after, 1))

          integration = Path("src/codex-integration.ts")
          source = integration.read_text()
          import_line = 'import { preserveNativeCodexModelDefault } from "./native-model-default";\n'
          if import_line not in source:
              anchor = '  textFormat,\n} from "./codex-integration-document";\n'
              if source.count(anchor) != 1:
                  raise SystemExit("parser import anchor was not unique after hardening")
              source = source.replace(anchor, anchor + import_line, 1)
              integration.write_text(source)

          notes = Path("ENHANCED.md")
          text = notes.read_text()
          text = text.replace(
              "The former Manual mode branding now appears as Manual mode.",
              "The former Zero Risk branding now appears as Manual mode.",
          )
          notes.write_text(text)

          runtime_test = Path("tests/runtime-layout.test.ts")
          replace_exact(
              runtime_test,
              '  expect(defaultConfig("full").subagentProtocol).toBe("compatibility-v1");',
              '  expect(defaultConfig("full").subagentProtocol).toBe("native");',
          )
          replace_exact(
              runtime_test,
              '''  expect(loadConfigForSetup()).toMatchObject({
              version: 3,
              mode: "browser-only",
              browserHost: "managed-chrome",
              browserInteractionMode: "automatic",
              subagentProtocol: "compatibility-v1",
              solAvailable: true,
            });''',
              '''  expect(loadConfigForSetup()).toMatchObject({
              version: 3,
              mode: "browser-only",
              browserHost: "managed-chrome",
              browserInteractionMode: "automatic",
              subagentProtocol: "native",
              solAvailable: true,
            });''',
          )

          server_models_test = Path("tests/server-models.test.ts")
          replace_exact(
              server_models_test,
              '''    additional_speed_tiers: [],
              service_tiers: [],
              default_service_tier: null,
              multi_agent_version: "v1",
            }]);''',
              '''    additional_speed_tiers: [],
              service_tiers: [],
              default_service_tier: null,
            }]);''',
          )

          for generated_path in (
              Path("scripts/apply-enhanced-hardening.mjs"),
              Path("src/native-model-default.ts"),
          ):
              raw = generated_path.read_text()
              normalized = "\n".join(line.rstrip(" \t") for line in raw.split("\n"))
              if normalized != raw:
                  generated_path.write_text(normalized)
          PY

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          (
            cd launcher
            bun install --frozen-lockfile
          )

      - name: Verify enhanced source
        shell: bash
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          git diff --check

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat: make Codex integration native-first"
          git push origin HEAD:codex/upstream-5.0.1
