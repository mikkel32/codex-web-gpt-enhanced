name: Prepare verified 5.20.2 source

on:
  push:
    branches: [release-prep/stream-recovery-5.20.2]
    paths: [.github/workflows/prepare-stream-recovery-5.20.2.yml]

permissions:
  contents: write

concurrency:
  group: prepare-stream-recovery-5.20.2
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'mikkel32/codex-web-gpt-enhanced' && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply only the exact locally verified source patch
        env:
          EXPECTED_BASE: 6265b3c434e740f6015df5b3960daa9d06918de4
          EXPECTED_STAGING_PARENT: 00380e11716a71a3cbf4b43e5acd6bf2db586679
          EXPECTED_SOURCE_TREE: 16f6085c4f54e2f206385e13b8faf569361a0781
          EXPECTED_PATCH_SHA256: 662ab9b5a00c5efc0e65248f10ba137cacae5aebecd94324a6e5c7f87967bba1
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import subprocess
          import tempfile

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          branch = 'release-prep/stream-recovery-5.20.2'
          workflow = '.github/workflows/prepare-stream-recovery-5.20.2.yml'
          payload = '.release-prep/stream-recovery-5.20.2.patch'
          base = os.environ['EXPECTED_BASE']
          if git('rev-parse', 'HEAD') != os.environ['GITHUB_SHA']:
              raise SystemExit('Checkout is not the exact requested preparation commit')
          if git('rev-parse', 'HEAD^') != os.environ['EXPECTED_STAGING_PARENT']:
              raise SystemExit('Preparation parent changed; refusing to apply')
          if git('ls-remote', 'origin', f'refs/heads/{branch}').split()[0] != os.environ['GITHUB_SHA']:
              raise SystemExit('Preparation branch changed; inspect its current state before retrying')
          if git('ls-remote', 'origin', 'refs/heads/main').split()[0] != base:
              raise SystemExit('Main changed; the candidate must be reviewed again before publication')
          if sorted(git('diff', '--name-only', base, 'HEAD').splitlines()) != sorted([workflow, payload]):
              raise SystemExit('Unexpected files in the preparation branch')
          patch = pathlib.Path(payload).read_bytes()
          if hashlib.sha256(patch).hexdigest() != os.environ['EXPECTED_PATCH_SHA256']:
              raise SystemExit('Patch checksum does not match the locally verified candidate')
          with tempfile.TemporaryDirectory(prefix='maria-verified-patch-') as temporary:
              patch_file = pathlib.Path(temporary) / 'candidate.patch'
              patch_file.write_bytes(patch)
              subprocess.run(['git', 'apply', '--index', '--check', str(patch_file)], check=True)
              subprocess.run(['git', 'apply', '--index', str(patch_file)], check=True)
          git('rm', '--', payload)
          # Exclude this temporary preparation workflow when verifying source parity.
          # It is restored unchanged in this commit and removed through the connected
          # GitHub account after the job, before the normal PR/CI/release sequence.
          git('rm', '--cached', '--', workflow)
          tree = git('write-tree')
          if tree != os.environ['EXPECTED_SOURCE_TREE']:
              raise SystemExit(f'Source tree mismatch: {tree}')
          git('add', '--', workflow)
          subprocess.run(['git', 'diff', '--cached', '--exit-code', 'HEAD', '--', workflow], check=True)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'fix: recover interrupted ChatGPT turns safely for stable 5.20.2')
          subprocess.run(['git', 'push', 'origin', f'HEAD:refs/heads/{branch}'], check=True)
          print(f'VERIFIED_SOURCE_TREE={tree}')
          print(f'PREPARED_COMMIT={git("rev-parse", "HEAD")}')
          PY
