name: Apply native coexistence hardening v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-native-coexistence-hardening-v3.yml
  workflow_run:
    workflows: ["Materialize pinned upstream source v2"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: native-coexistence-hardening-v3
  cancel-in-progress: false

jobs:
  harden:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASELINE_BRANCH: codex/upstream-5.0.1
      HARDENING_BRANCH: codex/native-coexistence-hardening-v3
    steps:
      - name: Check out repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for and check out verified baseline
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for attempt in $(seq 1 60); do
            if git fetch origin "$BASELINE_BRANCH:refs/remotes/origin/$BASELINE_BRANCH"; then
              found=true
              break
            fi
            sleep 15
          done
          test "$found" = true
          git checkout -B "$HARDENING_BRANCH" "origin/$BASELINE_BRANCH"

      - name: Apply coexistence, display, and onboarding fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path.cwd()
          literal = re.compile(r'["\']compatibility-v1["\']')

          def read(relative: str) -> str:
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f"required file is missing: {relative}")
              return path.read_text(encoding="utf-8")

          def write(relative: str, value: str) -> None:
              (root / relative).write_text(value, encoding="utf-8")

          def replace_scored_fallback(relative: str, require_subagent: bool = True) -> None:
              value = read(relative)
              candidates: list[tuple[int, int, int]] = []
              for match in literal.finditer(value):
                  line_start = value.rfind("\n", 0, match.start()) + 1
                  line_end = value.find("\n", match.end())
                  if line_end < 0:
                      line_end = len(value)
                  line = value[line_start:line_end]
                  lowered = line.lower()
                  score = 0
                  if "subagentprotocol" in lowered.replace("_", ""):
                      score += 10
                  if "??" in line or "||" in line:
                      score += 8
                  if "return" in lowered:
                      score += 7
                  if "fallback" in lowered or "default" in lowered:
                      score += 6
                  if ":" in line and "subagent" in lowered:
                      score += 5
                  if any(token in line for token in ("===", "!==", "case ", "includes(", "[\"compatibility-v1\"")):
                      score -= 20
                  candidates.append((score, match.start(), match.end()))
              if not candidates:
                  raise SystemExit(f"no compatibility fallback found in {relative}")
              candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
              score, start, end = candidates[0]
              threshold = 8 if require_subagent else 5
              if score < threshold:
                  raise SystemExit(f"no safe compatibility fallback candidate found in {relative}")
              write(relative, value[:start] + '"native"' + value[end:])

          config = read("src/config.ts")
          default_match = re.search(
              r'(subagentProtocol\s*:\s*)["\']compatibility-v1["\']',
              config,
          )
          if default_match is None:
              replace_scored_fallback("src/config.ts")
          else:
              config = config[:default_match.start()] + default_match.group(1) + '"native"' + config[default_match.end():]
              write("src/config.ts", config)

          replace_scored_fallback("src/setup.ts")
          replace_scored_fallback("src/codex-integration.ts")

          catalog = read("src/model-catalog.ts")
          catalog = catalog.replace("ChatGPT Web — Zero Risk Pro", "WebGPT · Manual Pro")
          catalog = catalog.replace("ChatGPT Web — Zero Risk", "WebGPT · Manual")
          catalog = catalog.replace("ChatGPT Web — ", "WebGPT · ")
          catalog = catalog.replace("ChatGPT Web —", "WebGPT ·")
          if "WebGPT · Manual" not in catalog:
              raise SystemExit("manual WebGPT model label was not updated")
          write("src/model-catalog.ts", catalog)

          for path in root.rglob("*.test.ts"):
              original = path.read_text(encoding="utf-8")
              lines: list[str] = []
              for line in original.splitlines(keepends=True):
                  normalized = line.lower().replace("_", "")
                  if (
                      "expect(" in line
                      and "subagentprotocol" in normalized
                      and line.count("compatibility-v1") == 1
                  ):
                      line = line.replace('"compatibility-v1"', '"native"').replace("'compatibility-v1'", "'native'")
                  line = line.replace("ChatGPT Web — Zero Risk Pro", "WebGPT · Manual Pro")
                  line = line.replace("ChatGPT Web — Zero Risk", "WebGPT · Manual")
                  line = line.replace("ChatGPT Web — ", "WebGPT · ")
                  lines.append(line)
              updated = "".join(lines)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")

          app_path = root / "launcher/src/App.tsx"
          if app_path.is_file():
              app = app_path.read_text(encoding="utf-8")
              app = app.replace("Support the project", "Support the project (optional)")
              anchor = app.find('stage === "support"')
              if anchor >= 0:
                  next_stage = app.find("stage ===", anchor + len('stage === "support"'))
                  if next_stage < 0:
                      next_stage = len(app)
                  support_block = app[anchor:next_stage]
                  support_block = re.sub(r'\s+disabled=\{[^{}\n]+\}', "", support_block)
                  app = app[:anchor] + support_block + app[next_stage:]
              app_path.write_text(app, encoding="utf-8")

          docs = root / "docs"
          docs.mkdir(exist_ok=True)
          (docs / "NATIVE_COEXISTENCE.md").write_text(
              """# Native Codex and WebGPT coexistence

Official Codex models and WebGPT models use separate lanes.

- Official model rows stay first and keep their upstream identifiers and metadata.
- WebGPT rows are appended with the `chatgpt-web/` prefix.
- Native Codex is the default subagent protocol.
- Compatibility V1 remains available as an explicit option.
- Requests without the `chatgpt-web/` prefix pass through to the official Codex backend.
- Existing `chatgpt-web/zero-risk` slugs remain stable; only their visible labels change.

## Display names

- `chatgpt-web/zero-risk` becomes `WebGPT · Manual`.
- `chatgpt-web/zero-risk-pro` becomes `WebGPT · Manual Pro`.
- Automatic WebGPT modes use the compact `WebGPT · <mode>` form.

## Release gate

Every fork change must pass version checks, type checking, server tests, launcher tests, launcher build, and the fork invariant guard before publication.
""",
              encoding="utf-8",
          )

          scripts = root / "scripts"
          scripts.mkdir(exist_ok=True)
          (scripts / "verify-fork-invariants.ts").write_text(
              """import { readFileSync } from "node:fs";

function requireMatch(value: string, pattern: RegExp, message: string): void {
  if (!pattern.test(value)) throw new Error(message);
}

const config = readFileSync("src/config.ts", "utf8");
const setup = readFileSync("src/setup.ts", "utf8");
const integration = readFileSync("src/codex-integration.ts", "utf8");
const catalog = readFileSync("src/model-catalog.ts", "utf8");
const server = readFileSync("src/server.ts", "utf8");

requireMatch(config, /subagentProtocol\s*:\s*["']native["']/, "native must remain the configured default protocol");
requireMatch(setup, /(?:\?\?|\|\||return|default|fallback)[^\n]*["']native["']|subagentProtocol[^\n]*["']native["']/, "setup must fall back to native");
requireMatch(integration, /(?:\?\?|\|\||return|default|fallback)[^\n]*["']native["']|subagentProtocol[^\n]*["']native["']/, "Codex integration must fall back to native");
requireMatch(catalog, /chatgpt-web\/zero-risk/, "the stable manual WebGPT slug is missing");
requireMatch(catalog, /WebGPT · Manual/, "the manual WebGPT display label is missing");
requireMatch(server, /startsWith\(/, "the model routing boundary is missing");
requireMatch(server, /WEBGPT_MODEL_PREFIX|chatgpt-web\//, "the WebGPT routing prefix is missing");
console.log("Fork invariants verified.");
""",
              encoding="utf-8",
          )

          workflows = root / ".github/workflows"
          workflows.mkdir(parents=True, exist_ok=True)
          (workflows / "fork-ci.yml").write_text(
              """name: Fork CI

on:
  pull_request:
  push:
    branches: [main, codex/native-coexistence-hardening-v3]

permissions:
  contents: read

concurrency:
  group: fork-ci
  cancel-in-progress: true

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun scripts/verify-fork-invariants.ts
      - run: bun run check-version
      - run: bun run typecheck
      - run: bun run test
      - run: bun run launcher:typecheck
      - run: bun run launcher:test
      - run: bun run launcher:build

  verify-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun scripts/verify-fork-invariants.ts
      - run: bun run check-version
      - run: bun run typecheck
      - run: bun run test
      - run: bun run launcher:typecheck
      - run: bun run launcher:test
      - run: bun run launcher:build
""",
              encoding="utf-8",
          )
          PY

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install launcher dependencies
        working-directory: launcher
        run: bun install --frozen-lockfile

      - name: Verify fork invariants
        run: bun scripts/verify-fork-invariants.ts

      - name: Run complete verification
        shell: bash
        run: |
          set -euo pipefail
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build

      - name: Commit and publish verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: preserve native Codex alongside WebGPT"
          git push --force-with-lease origin "$HARDENING_BRANCH"
