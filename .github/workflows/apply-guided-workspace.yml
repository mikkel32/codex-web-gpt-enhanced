name: Apply reviewed guided workspace

on:
  push:
    branches: [codex/guided-workspace-ui-20260907]
    paths: [.github/workflows/apply-guided-workspace.yml]

permissions:
  contents: write

concurrency:
  group: apply-reviewed-guided-workspace
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN: a6b38bf328b9262df47ef5c573f56056043472f9
      EXPECTED_PARENT: 23ca72403419d5bb648d372734186b8c2faa34b5
      EXPECTED_TREE: 5cb0698b929ac96b35a80a354d0534a693d6c03f
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reproduce the exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = ''.join(Path(f'.ui-review/patch-{i}.b64').read_text() for i in range(1, 5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5bf8dd59d2ec96f62022f387ac10a1d7178c852ca7fca99a8cfe01d8a3fd1385'
          Path(os.environ['RUNNER_TEMP'], 'guided-workspace.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/guided-workspace.patch"
          git apply "$RUNNER_TEMP/guided-workspace.patch"
          rm -r .ui-review
          rm .github/workflows/apply-guided-workspace.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run check-version
      - run: bun run typecheck
      - run: bun run test
      - run: bun run launcher:test
      - run: bun run launcher:build
      - name: Test the actual Electron UI
        run: bun run smoke:guided-ui
      - name: Save only verified source to the review branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: redesign Maria around guided setup and verified workspace health'
          git push origin HEAD:refs/heads/codex/ui-reviewed-20260907
          {
            echo '## Reviewed UI source verified'
            echo "Commit: $(git rev-parse HEAD)"
            echo "Tree: $(git rev-parse HEAD^{tree})"
            echo 'All core tests, launcher tests, type checks, renderer build, and real-Electron guided UI scenarios passed.'
          } >> "$GITHUB_STEP_SUMMARY"
