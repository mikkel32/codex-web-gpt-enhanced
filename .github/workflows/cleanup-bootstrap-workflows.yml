name: Clean superseded bootstrap workflows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-bootstrap-workflows.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove superseded workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            .github/workflows/materialize-upstream.yml \
            .github/workflows/apply-native-coexistence-hardening.yml \
            .github/workflows/cleanup-bootstrap-workflows.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove superseded bootstrap workflows"
          git push origin HEAD:main
