name: Finalize native coexistence release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-native-coexistence-release.yml
  workflow_run:
    workflows: ["Apply native coexistence hardening v4"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-native-coexistence-release
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HARDENING_BRANCH: codex/native-coexistence-hardening-v4
    steps:
      - name: Check out repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for verified hardening branch
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for attempt in $(seq 1 120); do
            if git fetch origin "$HARDENING_BRANCH:refs/remotes/origin/$HARDENING_BRANCH"; then
              found=true
              break
            fi
            sleep 15
          done
          test "$found" = true
          git checkout -B release-candidate "origin/$HARDENING_BRANCH"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install launcher dependencies
        working-directory: launcher
        run: bun install --frozen-lockfile

      - name: Verify fork invariants
        run: bun scripts/verify-fork-invariants.ts

      - name: Run authoritative upstream verification
        run: bun run verify

      - name: Create review pull request when permitted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HARDENING_BRANCH" --base main --state open --json number --jq '.[0].number // empty' || true)"
          if [ -n "$existing" ]; then
            exit 0
          fi
          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          This release starts from the exact upstream 5.0.1 commit pinned in `UPSTREAM.lock`.

          It restores native Codex as the default protocol, keeps Compatibility V1 available explicitly, clarifies WebGPT model labels, removes the required social-link onboarding gate, documents the routing contract, and adds fork-specific Linux/macOS CI.

          Publication is gated by the fork invariant check and the upstream `bun run verify` suite.
          EOF
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$HARDENING_BRANCH" \
            --title "Preserve native Codex models alongside WebGPT" \
            --body-file "$RUNNER_TEMP/pr-body.md" || true

      - name: Merge verified release into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add -B release-main "$RUNNER_TEMP/release-main" origin/main
          cd "$RUNNER_TEMP/release-main"
          git merge --no-ff "origin/$HARDENING_BRANCH" -m "release: native Codex and WebGPT coexistence hardening"

          cat > RELEASE_STATUS.md <<'EOF'
          # Release status

          The repository is materialized from the exact upstream commit recorded in `UPSTREAM.lock`.

          The native coexistence release passed:

          - the fork routing and display invariant guard;
          - the upstream `bun run verify` gate;
          - server type checks and tests;
          - launcher type checks, tests, and production build.

          The reviewed source remains available on `codex/native-coexistence-hardening-v4`.
          EOF

          git rm --ignore-unmatch \
            .github/workflows/materialize-upstream.yml \
            .github/workflows/materialize-upstream-v2.yml \
            .github/workflows/apply-native-coexistence-hardening.yml \
            .github/workflows/apply-native-coexistence-hardening-v2.yml \
            .github/workflows/apply-native-coexistence-hardening-v3.yml \
            .github/workflows/apply-native-coexistence-hardening-v4.yml \
            .github/workflows/finalize-native-coexistence-release.yml \
            .github/workflows/cleanup-bootstrap-workflows.yml
          git add RELEASE_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: record verified release and remove bootstrap workflows"
          fi
          git push origin HEAD:main
