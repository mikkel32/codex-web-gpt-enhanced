name: PR4 source review

on:
  push:
    branches: [codex/automatic-setup-recovery-20260907]
    paths: [.github/workflows/pr4-source-review.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Export source and isolated Linux test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr4-review"
          git bundle create "$RUNNER_TEMP/pr4-review/source.bundle" --all
          cp "$(command -v bun)" "$RUNNER_TEMP/pr4-review/bun"
          tar -czf "$RUNNER_TEMP/pr4-review/dependencies.tar.gz" --exclude='launcher/node_modules/electron/dist' node_modules launcher/node_modules
          git rev-parse HEAD > "$RUNNER_TEMP/pr4-review/source-sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pr4-source-review
          path: ${{ runner.temp }}/pr4-review/
          retention-days: 1
          if-no-files-found: error
