name: Connection repair workspace

on:
  push:
    branches: ['fix/automated-launcher-setup-20260907']
    paths: ['.github/workflows/connection-workspace.yml']

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Package tracked source only
        run: git archive --format=tar HEAD > connection-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: connection-source
          path: connection-source.tar
          retention-days: 1
