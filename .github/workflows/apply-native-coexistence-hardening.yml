name: Apply native coexistence hardening

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Materialize pinned upstream source v2"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: native-coexistence-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASELINE_BRANCH: codex/upstream-5.0.1
      HARDENING_BRANCH: codex/native-coexistence-hardening
    steps:
      - name: Check out verified baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_BRANCH }}
          fetch-depth: 0

      - name: Create hardening branch
        shell: bash
        run: git checkout -B "$HARDENING_BRANCH"

      - name: Apply coexistence, display, and onboarding fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          ROOT = Path.cwd()

          def read(relative: str) -> str:
              path = ROOT / relative
              if not path.is_file():
                  raise SystemExit(f"required file is missing: {relative}")
              return path.read_text(encoding="utf-8")

          def write(relative: str, value: str) -> None:
              (ROOT / relative).write_text(value, encoding="utf-8")

          def replace_required(relative: str, old: str, new: str, minimum: int = 1) -> int:
              value = read(relative)
              count = value.count(old)
              if count < minimum:
                  raise SystemExit(f"expected at least {minimum} occurrence(s) in {relative}: {old!r}")
              write(relative, value.replace(old, new))
              return count

          # Native Codex remains the default execution protocol. Compatibility V1 is
          # still available as an explicit choice for WebGPT-specific workflows.
          config = read("src/config.ts")
          config, count = re.subn(
              r'(subagentProtocol\s*:\s*)["\']compatibility-v1["\']',
              r'\1"native"',
              config,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not change the default subagent protocol in src/config.ts")
          write("src/config.ts", config)

          for relative in ("src/setup.ts", "src/codex-integration.ts"):
              value = read(relative)
              value, count = re.subn(
                  r'((?:\?\?|\|\|)\s*)["\']compatibility-v1["\']',
                  r'\1"native"',
                  value,
              )
              if count < 1:
                  raise SystemExit(f"could not change compatibility fallback in {relative}")
              write(relative, value)

          # Keep stable model slugs for existing installations while making the
          # labels compact and unambiguous in Codex's model picker.
          catalog = read("src/model-catalog.ts")
          catalog = catalog.replace("ChatGPT Web — Zero Risk Pro", "WebGPT · Manual Pro")
          catalog = catalog.replace("ChatGPT Web — Zero Risk", "WebGPT · Manual")
          catalog = catalog.replace("ChatGPT Web — ", "WebGPT · ")
          catalog = catalog.replace("ChatGPT Web —", "WebGPT ·")
          if "WebGPT · Manual" not in catalog:
              raise SystemExit("manual WebGPT model label was not updated")
          write("src/model-catalog.ts", catalog)

          # Update only assertions that explicitly inspect the resolved default.
          for path in ROOT.rglob("*.test.ts"):
              value = path.read_text(encoding="utf-8")
              lines = []
              changed = False
              for line in value.splitlines(keepends=True):
                  if (
                      "compatibility-v1" in line
                      and ".subagentProtocol" in line
                      and ("expect(" in line or ".toBe(" in line or ".toEqual(" in line)
                  ):
                      line = line.replace('"compatibility-v1"', '"native"').replace("'compatibility-v1'", "'native'")
                      changed = True
                  line = line.replace("ChatGPT Web — Zero Risk Pro", "WebGPT · Manual Pro")
                  line = line.replace("ChatGPT Web — Zero Risk", "WebGPT · Manual")
                  line = line.replace("ChatGPT Web — ", "WebGPT · ")
                  lines.append(line)
              if changed or "".join(lines) != value:
                  path.write_text("".join(lines), encoding="utf-8")

          # The support screen remains available, but opening social links is no
          # longer a condition for completing setup.
          app_path = ROOT / "launcher/src/App.tsx"
          if app_path.is_file():
              app = app_path.read_text(encoding="utf-8")
              app = app.replace("Support the project", "Support the project (optional)")
              app = re.sub(
                  r'\s+disabled=\{\s*![A-Za-z_$][\w$]*\s*(?:\|\||&&)\s*![A-Za-z_$][\w$]*\s*\}',
                  "",
                  app,
              )
              app_path.write_text(app, encoding="utf-8")

          docs = ROOT / "docs"
          docs.mkdir(exist_ok=True)
          (docs / "NATIVE_COEXISTENCE.md").write_text(
              """# Native Codex and WebGPT coexistence\n\n"
              "The fork treats official Codex models and WebGPT models as separate lanes.\n\n"
              "- Official model rows stay first and retain their upstream data.\n"
              "- WebGPT rows are appended with the `chatgpt-web/` prefix.\n"
              "- Native Codex is the default subagent protocol.\n"
              "- Compatibility V1 remains an explicit opt-in.\n"
              "- Requests for models without the `chatgpt-web/` prefix pass through to the official Codex backend.\n"
              "- Existing `chatgpt-web/zero-risk` slugs remain stable; only their visible labels are clearer.\n\n"
              "## Display names\n\n"
              "- `chatgpt-web/zero-risk` → `WebGPT · Manual`\n"
              "- `chatgpt-web/zero-risk-pro` → `WebGPT · Manual Pro`\n"
              "- Automatic WebGPT modes use the compact `WebGPT · <mode>` form.\n\n"
              "## Release gate\n\n"
              "Every fork change must pass version checks, type checking, server tests, launcher tests, launcher build, and the fork invariant guard before publication.\n"
              """,
              encoding="utf-8",
          )

          scripts = ROOT / "scripts"
          scripts.mkdir(exist_ok=True)
          (scripts / "verify-fork-invariants.ts").write_text(
              """import { readFileSync } from \"node:fs\";\n\n"
              "function requireMatch(value: string, pattern: RegExp, message: string): void {\n"
              "  if (!pattern.test(value)) throw new Error(message);\n"
              "}\n\n"
              "const config = readFileSync(\"src/config.ts\", \"utf8\");\n"
              "const catalog = readFileSync(\"src/model-catalog.ts\", \"utf8\");\n"
              "const server = readFileSync(\"src/server.ts\", \"utf8\");\n\n"
              "requireMatch(config, /subagentProtocol\\s*:\\s*[\"']native[\"']/, \"native must remain the default subagent protocol\");\n"
              "requireMatch(catalog, /chatgpt-web\\/zero-risk/, \"the stable manual WebGPT slug is missing\");\n"
              "requireMatch(catalog, /WebGPT · Manual/, \"the manual WebGPT display label is missing\");\n"
              "requireMatch(server, /startsWith\\([^)]*chatgpt-web\\//, \"the WebGPT routing boundary is missing\");\n"
              "console.log(\"Fork invariants verified.\");\n"
              """,
              encoding="utf-8",
          )

          workflows = ROOT / ".github/workflows"
          workflows.mkdir(parents=True, exist_ok=True)
          (workflows / "fork-ci.yml").write_text(
              """name: Fork CI\n\n"
              "on:\n"
              "  pull_request:\n"
              "  push:\n"
              "    branches: [main, codex/native-coexistence-hardening]\n\n"
              "permissions:\n"
              "  contents: read\n\n"
              "concurrency:\n"
              "  group: fork-ci-${{ github.workflow }}-${{ github.ref }}\n"
              "  cancel-in-progress: true\n\n"
              "jobs:\n"
              "  verify:\n"
              "    strategy:\n"
              "      fail-fast: false\n"
              "      matrix:\n"
              "        os: [ubuntu-latest, macos-latest]\n"
              "    runs-on: ${{ matrix.os }}\n"
              "    timeout-minutes: 30\n"
              "    steps:\n"
              "      - uses: actions/checkout@v4\n"
              "      - uses: oven-sh/setup-bun@v2\n"
              "        with:\n"
              "          bun-version: latest\n"
              "      - run: bun install --frozen-lockfile\n"
              "      - run: bun install --frozen-lockfile\n"
              "        working-directory: launcher\n"
              "      - run: bun scripts/verify-fork-invariants.ts\n"
              "      - run: bun run check-version\n"
              "      - run: bun run typecheck\n"
              "      - run: bun run test\n"
              "      - run: bun run launcher:typecheck\n"
              "      - run: bun run launcher:test\n"
              "      - run: bun run launcher:build\n"
              """,
              encoding="utf-8",
          )
          PY

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install launcher dependencies
        working-directory: launcher
        run: bun install --frozen-lockfile

      - name: Verify fork invariants
        run: bun scripts/verify-fork-invariants.ts

      - name: Run complete verification
        shell: bash
        run: |
          set -euo pipefail
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: preserve native Codex alongside WebGPT"
          git push --force-with-lease origin "$HARDENING_BRANCH"
